<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>ترین کانت | حضور و غیاب شاگردان</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b5bd6'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- icon sprite -->
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 00-4-4H6a4 4 0 00-4 4V20M9 10.5a4 4 0 100-8 4 4 0 000 8zM22 20v-1.5a4 4 0 00-3-3.87M16.5 3.1a4 4 0 010 7.75" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><path d="M9 4.5h6a1.5 1.5 0 011.5 1.5v.5H19a1.5 1.5 0 011.5 1.5v12A1.5 1.5 0 0119 21.5H5A1.5 1.5 0 013.5 20V8A1.5 1.5 0 015 6.5h2.5V6A1.5 1.5 0 019 4.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 13l2.2 2.2 4.8-4.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M16 16l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 17l5-5-5-5M20 12H9M11 20H6a2 2 0 01-2-2V6a2 2 0 012-2h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 8h11l-3-3M17 16H6l3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 12.5A1.5 1.5 0 008.5 21h7a1.5 1.5 0 001.5-1.5L18 7M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l10-10a2.5 2.5 0 10-3.5-3.5L4.5 16.5 4 20z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7.5a4 4 0 118 0V10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5l9 16H3l9-16z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9.5v4.5M12 16.8v.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <!-- ============================ LOGIN ============================ -->
  <section id="login" class="login">
    <div class="login__glow login__glow--a"></div>
    <div class="login__glow login__glow--b"></div>

    <form class="login__card" id="login-form" autocomplete="on" novalidate>
      <div class="login__brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" width="22" height="22"><use href="#i-clipboard"/></svg>
        </span>
        <div>
          <h1 class="login__title">ترین کانت</h1>
          <p class="login__subtitle">سامانه حضور و غیاب شاگردان</p>
        </div>
      </div>

      <label class="field">
        <span class="field__label">نام کاربری</span>
        <span class="field__box">
          <svg width="18" height="18" class="field__icon"><use href="#i-users"/></svg>
          <input id="username" name="username" type="text" dir="ltr" autocomplete="username" maxlength="64" spellcheck="false" autocapitalize="none" required />
        </span>
      </label>

      <label class="field">
        <span class="field__label">رمز عبور</span>
        <span class="field__box">
          <svg width="18" height="18" class="field__icon"><use href="#i-lock"/></svg>
          <input id="password" name="password" type="password" dir="ltr" autocomplete="current-password" maxlength="128" required />
          <button type="button" class="field__peek" id="peek" aria-label="نمایش رمز عبور">نمایش</button>
        </span>
      </label>

      <p class="login__error" id="login-error" role="alert" hidden></p>

      <button class="btn btn--primary btn--block btn--lg" id="login-submit" type="submit">
        <span>ورود به سامانه</span>
      </button>

      <p class="login__note">
        <svg width="15" height="15"><use href="#i-lock"/></svg>
        این سامانه خصوصی است؛ ثبت‌نام آزاد ندارد و فقط حساب‌های تعریف‌شده دسترسی دارند.
      </p>
    </form>
  </section>

  <!-- ============================= APP ============================= -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="logo logo--sm">
          <svg viewBox="0 0 24 24" width="18" height="18"><use href="#i-clipboard"/></svg>
        </span>
        <div class="sidebar__brand-text">
          <strong>ترین کانت</strong>
          <small>حضور و غیاب</small>
        </div>
      </div>

      <nav class="sidebar__nav" id="nav">
        <a class="navlink" href="#/today" data-route="today">
          <svg width="20" height="20"><use href="#i-clipboard"/></svg><span>ثبت حضور</span>
        </a>
        <a class="navlink" href="#/students" data-route="students">
          <svg width="20" height="20"><use href="#i-users"/></svg><span>شاگردان</span>
        </a>
        <a class="navlink" href="#/calendar" data-route="calendar">
          <svg width="20" height="20"><use href="#i-calendar"/></svg><span>تقویم</span>
        </a>
      </nav>

      <div class="sidebar__foot">
        <div class="user">
          <span class="user__avatar" id="user-avatar">م</span>
          <div class="user__meta">
            <strong id="user-name">—</strong>
            <small id="user-handle">—</small>
          </div>
        </div>
        <div class="sidebar__actions">
          <button class="iconbtn" id="theme-toggle" type="button" title="حالت شب / روز" aria-label="تغییر تم">
            <svg width="18" height="18"><use href="#i-moon"/></svg>
          </button>
          <button class="iconbtn iconbtn--danger" id="logout" type="button" title="خروج" aria-label="خروج">
            <svg width="18" height="18"><use href="#i-logout"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar__date">
          <strong id="topbar-day">—</strong>
          <small id="topbar-sub">—</small>
        </div>
        <div class="topbar__tools">
          <button class="iconbtn" id="theme-toggle-m" type="button" aria-label="تغییر تم">
            <svg width="18" height="18"><use href="#i-moon"/></svg>
          </button>
          <button class="iconbtn iconbtn--danger" id="logout-m" type="button" aria-label="خروج">
            <svg width="18" height="18"><use href="#i-logout"/></svg>
          </button>
        </div>
      </header>

      <div id="view" class="view"></div>
    </main>

    <nav class="tabbar" id="tabbar">
      <a class="tablink" href="#/today" data-route="today">
        <svg width="21" height="21"><use href="#i-clipboard"/></svg><span>ثبت حضور</span>
      </a>
      <a class="tablink" href="#/students" data-route="students">
        <svg width="21" height="21"><use href="#i-users"/></svg><span>شاگردان</span>
      </a>
      <a class="tablink" href="#/calendar" data-route="calendar">
        <svg width="21" height="21"><use href="#i-calendar"/></svg><span>تقویم</span>
      </a>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toasts" aria-live="polite"></div>

  <script src="/lib/jalali.js"></script>
  <script src="/app.js"></script>
</body>
</html>
